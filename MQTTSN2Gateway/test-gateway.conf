#**************************************************************************
# Copyright (c) 2026 Ian Craggs
#
# Test configuration for MQTT-SN 2.0 Gateway integration tests.
#
# Requires a running MQTT broker on localhost:1883 (TCP).
# Start one with: mosquitto -v
#
# The gateway listens for MQTT-SN clients on UDP port 1883 (unicast).
# test22/test23 (MQTTSN2Packet) connect to localhost:1883 UDP by default.
#***************************************************************************

GatewayID=1
GatewayName=PahoGateway-Test
MaxNumberOfClients=30
KeepAlive=60

BrokerName=localhost
BrokerPortNo=1883
BrokerSecurePortNo=8883

AggregatingGateway=NO
QoS-1=NO
Forwarder=NO
PredefinedTopic=NO
ClientAuthentication=NO

#==============================
#  UDP sensor network
#==============================

# Clients connect to this unicast port (matches test22/test23 default port 1883)
GatewayPortNo=1883

# Multicast discovery (not used by tests; moved off 1883 to avoid bind conflict)
MulticastPortNo=1884
MulticastIP=225.1.1.1
MulticastTTL=1

ShearedMemory=NO

#==============================
#  MQTT-SN 2.0 PROTECTION
#==============================

# 8-byte sender identifier (hex, no spaces)
ProtectionSenderId=DEADBEEFCAFEBABE

# 32-byte HMAC-SHA256 pre-shared key (hex, no spaces)
ProtectionKey=000102030405060708090A0B0C0D0E0F101112131415161718191A1B1C1D1E1F

name: "Builds for MacOS"
on: [push, pull_request] 

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          brew update
          brew install doxygen
      - name: Build
        run: |
          rm -rf build.paho
          mkdir build.paho
          cd build.paho
          echo "pwd $PWD"
          cmake -DSENSORNET=udp ..
          cmake --build .
      - name: run tests
        run: |
          cd build.paho
          ctest -VV --timeout 600 
      - name: clean up
        run: |
          killall python || true
          sleep 3 # allow broker time to terminate and report
      - name: package
        run: |
          cd build.paho
          cpack --verbose
